name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev pkg-config

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate Tailwind CSS
        working-directory: crates/app
        run: |
          bun install tailwindcss
          bunx @tailwindcss/cli -i input.css -o assets/tailwind.css --minify

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --features ftp-tests

  build:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            cli_artifact: rsfdl-cli-macos-arm64
            app_artifact: rsfdl-app-macos-arm64
            package_types: '--package-types dmg'
          - platform: macos-latest
            target: x86_64-apple-darwin
            cli_artifact: rsfdl-cli-macos-x64
            app_artifact: rsfdl-app-macos-x64
            package_types: '--package-types dmg'
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cli_artifact: rsfdl-cli-linux-x64
            app_artifact: rsfdl-app-linux-x64
            package_types: '--package-types deb --package-types rpm --package-types appimage'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            cli_artifact: rsfdl-cli-windows-x64
            app_artifact: rsfdl-app-windows-x64
            package_types: '--package-types msi --package-types nsis'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev libssl-dev libxdo-dev pkg-config \
            libfuse2 librsvg2-dev

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Generate Tailwind CSS
        working-directory: crates/app
        run: |
          bun install tailwindcss
          bunx @tailwindcss/cli -i input.css -o assets/tailwind.css --minify

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Cache Dioxus CLI
        id: cache-dx
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/dx
            ~/.cargo/bin/dx.exe
          key: dioxus-cli-0.7.3-${{ runner.os }}

      - name: Install cargo-binstall
        if: steps.cache-dx.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install Dioxus CLI
        if: steps.cache-dx.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli@0.7.3 --no-confirm --locked

      - name: Build GUI installers (optional)
        continue-on-error: true
        run: dx bundle --release -p rsfdl-app --desktop --target ${{ matrix.target }} ${{ matrix.package_types }}

      # Package CLI artifacts
      - name: Package CLI (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging
          cp target/${{ matrix.target }}/release/rsfdl-cli staging/rsfdl-cli
          cd staging && tar czf ../${{ matrix.cli_artifact }}.tar.gz rsfdl-cli

      - name: Package CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/${{ matrix.target }}/release/rsfdl-cli.exe" "staging/rsfdl-cli.exe"
          Compress-Archive -Path "staging/rsfdl-cli.exe" -DestinationPath "${{ matrix.cli_artifact }}.zip"

      # Package GUI binary
      - name: Package GUI binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging-app
          cp target/${{ matrix.target }}/release/rsfdl-app staging-app/rsfdl-app
          cd staging-app && tar czf ../${{ matrix.app_artifact }}.tar.gz rsfdl-app

      - name: Package GUI binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging-app
          Copy-Item "target/${{ matrix.target }}/release/rsfdl-app.exe" "staging-app/rsfdl-app.exe"
          Compress-Archive -Path "staging-app/rsfdl-app.exe" -DestinationPath "${{ matrix.app_artifact }}.zip"
