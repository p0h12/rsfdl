<!DOCTYPE html>
<html lang="de">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>rsfdl — UI Prototype (React)</title>
	<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
	<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
	<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
	<style>
		:root {
			--font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			--font-mono: 'SF Mono', SFMono-Regular, ui-monospace, 'Cascadia Code', Menlo, monospace;
			--border-radius-sm: 4px;
			--border-radius-md: 8px;
			--border-radius-lg: 12px;

			/* Light mode */
			--color-background-primary: #ffffff;
			--color-background-secondary: #f7f7f5;
			--color-background-tertiary: #f0f0ec;
			--color-text-primary: #1a1a1a;
			--color-text-secondary: #6b6b6b;
			--color-text-tertiary: #999;
			--color-border-primary: #888;
			--color-border-secondary: #d4d4d0;
			--color-border-tertiary: #e8e8e4;
			--color-accent: #BA7517;
			--color-accent-bg: rgba(186, 117, 23, .08);
			--color-accent-border: rgba(186, 117, 23, .25);
			--color-success: #2d8a4e;
			--color-success-bg: rgba(45, 138, 78, .08);
			--color-error: #d1242f;
			--color-error-bg: rgba(209, 36, 47, .08);
			--color-warning: #bf8700;
			--color-warning-bg: rgba(191, 135, 0, .08);
			--shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
			--shadow-md: 0 2px 8px rgba(0, 0, 0, .06);
			--shadow-lg: 0 4px 16px rgba(0, 0, 0, .1);
		}

		@media (prefers-color-scheme: dark) {
			:root:not([data-theme="light"]) {
				--color-background-primary: #161616;
				--color-background-secondary: #1e1e1e;
				--color-background-tertiary: #262626;
				--color-text-primary: #e8e8e4;
				--color-text-secondary: #999;
				--color-text-tertiary: #666;
				--color-border-primary: #666;
				--color-border-secondary: #383838;
				--color-border-tertiary: #2a2a2a;
				--color-accent: #d4922a;
				--color-accent-bg: rgba(212, 146, 42, .1);
				--color-accent-border: rgba(212, 146, 42, .3);
				--color-success: #3fb950;
				--color-success-bg: rgba(63, 185, 80, .1);
				--color-error: #f85149;
				--color-error-bg: rgba(248, 81, 73, .1);
				--color-warning: #d29922;
				--color-warning-bg: rgba(210, 153, 34, .1);
				--shadow-sm: 0 1px 2px rgba(0, 0, 0, .2);
				--shadow-md: 0 2px 8px rgba(0, 0, 0, .3);
				--shadow-lg: 0 4px 16px rgba(0, 0, 0, .4);
			}
		}

		:root[data-theme="dark"] {
			--color-background-primary: #161616;
			--color-background-secondary: #1e1e1e;
			--color-background-tertiary: #262626;
			--color-text-primary: #e8e8e4;
			--color-text-secondary: #999;
			--color-text-tertiary: #666;
			--color-border-primary: #666;
			--color-border-secondary: #383838;
			--color-border-tertiary: #2a2a2a;
			--color-accent: #d4922a;
			--color-accent-bg: rgba(212, 146, 42, .1);
			--color-accent-border: rgba(212, 146, 42, .3);
			--color-success: #3fb950;
			--color-success-bg: rgba(63, 185, 80, .1);
			--color-error: #f85149;
			--color-error-bg: rgba(248, 81, 73, .1);
			--color-warning: #d29922;
			--color-warning-bg: rgba(210, 153, 34, .1);
			--shadow-sm: 0 1px 2px rgba(0, 0, 0, .2);
			--shadow-md: 0 2px 8px rgba(0, 0, 0, .3);
			--shadow-lg: 0 4px 16px rgba(0, 0, 0, .4);
		}

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			font-family: var(--font-sans);
			background: var(--color-background-secondary);
			color: var(--color-text-primary);
			min-height: 100vh;
			-webkit-font-smoothing: antialiased;
		}

		/* ── Header ── */
		.app-header {
			background: var(--color-background-primary);
			border-bottom: 0.5px solid var(--color-border-tertiary);
			padding: 0 1rem;
			height: 52px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			position: sticky;
			top: 0;
			z-index: 50;
		}

		.app-logo {
			display: flex;
			align-items: center;
			gap: 10px;
			font-weight: 600;
			font-size: 16px;
			color: var(--color-text-primary);
		}

		.logo-icon {
			width: 32px;
			height: 32px;
			border-radius: var(--border-radius-md);
			background: var(--color-accent);
			display: flex;
			align-items: center;
			justify-content: center;
			color: #fff;
		}

		.app-actions {
			display: flex;
			gap: 6px;
		}

		/* ── Buttons ── */
		.btn {
			font-family: var(--font-sans);
			cursor: pointer;
			border-radius: var(--border-radius-md);
			font-size: 13px;
			transition: opacity .12s, background .12s;
			display: inline-flex;
			align-items: center;
			gap: 6px;
			white-space: nowrap;
		}

		.btn-primary {
			background: var(--color-text-primary);
			color: var(--color-background-primary);
			border: none;
			padding: 8px 18px;
			font-weight: 500;
		}

		.btn-primary:hover {
			opacity: .8;
		}

		.btn-accent {
			background: var(--color-accent);
			color: #fff;
			border: none;
			padding: 8px 18px;
			font-weight: 500;
		}

		.btn-accent:hover {
			opacity: .85;
		}

		.btn-ghost {
			background: none;
			color: var(--color-text-secondary);
			border: 0.5px solid var(--color-border-secondary);
			padding: 7px 14px;
		}

		.btn-ghost:hover {
			background: var(--color-background-secondary);
		}

		.btn-icon {
			background: none;
			border: none;
			color: var(--color-text-secondary);
			padding: 6px;
			cursor: pointer;
			border-radius: var(--border-radius-sm);
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background .12s, color .12s;
		}

		.btn-icon:hover {
			background: var(--color-background-secondary);
			color: var(--color-text-primary);
		}

		.btn-danger {
			color: var(--color-error);
		}

		.btn-danger:hover {
			background: var(--color-error-bg);
			color: var(--color-error);
		}

		.btn-sm {
			padding: 5px 10px;
			font-size: 12px;
		}

		.btn-lg {
			padding: 10px 24px;
			font-size: 14px;
		}

		/* ── Main Layout ── */
		.main-wrap {
			max-width: 900px;
			margin: 0 auto;
			padding: 1.25rem 1rem 4rem;
		}

		/* ── Drop Zone (empty state) ── */
		.drop-zone {
			border: 1.5px dashed var(--color-border-secondary);
			border-radius: var(--border-radius-lg);
			padding: 5rem 2rem;
			text-align: center;
			cursor: pointer;
			transition: background .15s, border-color .15s;
			background: var(--color-background-primary);
		}

		.drop-zone:hover, .drop-zone.drag-over {
			background: var(--color-accent-bg);
			border-color: var(--color-accent);
		}

		.dz-icon {
			width: 56px;
			height: 56px;
			margin: 0 auto 1.25rem;
			border-radius: var(--border-radius-lg);
			background: var(--color-background-secondary);
			border: 0.5px solid var(--color-border-tertiary);
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--color-text-secondary);
		}

		.dz-title {
			font-size: 18px;
			font-weight: 500;
			margin-bottom: .4rem;
			color: var(--color-text-primary);
		}

		.dz-sub {
			font-size: 14px;
			color: var(--color-text-secondary);
			margin-bottom: 1.25rem;
		}

		.dz-hint {
			font-size: 12px;
			color: var(--color-text-tertiary);
			margin-top: 1.25rem;
			font-family: var(--font-mono);
		}

		/* ── Full-window drag overlay ── */
		.drag-overlay {
			display: none;
			position: fixed;
			inset: 0;
			z-index: 999;
			background: rgba(0, 0, 0, .45);
			backdrop-filter: blur(4px);
			-webkit-backdrop-filter: blur(4px);
			align-items: center;
			justify-content: center;
			pointer-events: none;
		}

		.drag-overlay.active {
			display: flex;
		}

		.drag-overlay-inner {
			background: var(--color-background-primary);
			border: 2px dashed var(--color-accent);
			border-radius: var(--border-radius-lg);
			padding: 3rem 4rem;
			text-align: center;
			box-shadow: var(--shadow-lg);
		}

		.drag-overlay-inner .dz-icon {
			margin: 0 auto 1rem;
		}

		/* ── Container List ── */
		.container-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 1rem;
			gap: 8px;
			flex-wrap: wrap;
		}

		.container-toolbar-left {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.container-count {
			font-size: 13px;
			color: var(--color-text-secondary);
			font-family: var(--font-mono);
		}

		/* ── SFDL Container Card ── */
		.sfdl-card {
			background: var(--color-background-primary);
			border: 0.5px solid var(--color-border-tertiary);
			border-radius: var(--border-radius-lg);
			margin-bottom: 12px;
			overflow: hidden;
			box-shadow: var(--shadow-sm);
			transition: border-color .15s, box-shadow .15s;
		}

		.sfdl-card.dragging {
			opacity: .5;
			border-color: var(--color-accent);
		}

		.sfdl-card.drag-target {
			border-color: var(--color-accent);
			box-shadow: 0 0 0 2px var(--color-accent-bg);
		}

		.card-header {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 14px 16px;
			border-bottom: 0.5px solid var(--color-border-tertiary);
			cursor: pointer;
			user-select: none;
		}

		.drag-handle {
			cursor: grab;
			color: var(--color-text-tertiary);
			padding: 2px;
			flex-shrink: 0;
			touch-action: none;
		}

		.drag-handle:active {
			cursor: grabbing;
		}

		.card-icon {
			width: 36px;
			height: 36px;
			border-radius: var(--border-radius-md);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}

		.card-icon.encrypted {
			background: var(--color-warning-bg);
			color: var(--color-warning);
		}

		.card-icon.decrypted {
			background: var(--color-accent-bg);
			color: var(--color-accent);
		}

		.card-icon.open {
			background: var(--color-success-bg);
			color: var(--color-success);
		}

		.card-info {
			flex: 1;
			min-width: 0;
		}

		.card-name {
			font-size: 14px;
			font-weight: 500;
			color: var(--color-text-primary);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.card-meta {
			font-size: 12px;
			color: var(--color-text-secondary);
			font-family: var(--font-mono);
			margin-top: 2px;
			display: flex;
			align-items: center;
			gap: 8px;
			flex-wrap: wrap;
		}

		.card-badge {
			font-size: 10px;
			font-weight: 500;
			padding: 2px 7px;
			border-radius: 4px;
			text-transform: uppercase;
			letter-spacing: .04em;
		}

		.badge-encrypted {
			background: var(--color-warning-bg);
			color: var(--color-warning);
			border: 0.5px solid rgba(191, 135, 0, .2);
		}

		.badge-v2 {
			background: var(--color-background-secondary);
			color: var(--color-text-secondary);
			border: 0.5px solid var(--color-border-tertiary);
		}

		.badge-v3 {
			background: var(--color-accent-bg);
			color: var(--color-accent);
			border: 0.5px solid var(--color-accent-border);
		}

		.badge-downloading {
			background: var(--color-success-bg);
			color: var(--color-success);
			border: 0.5px solid rgba(45, 138, 78, .2);
		}

		.card-chevron {
			color: var(--color-text-tertiary);
			transition: transform .15s;
			flex-shrink: 0;
		}

		.card-chevron.open {
			transform: rotate(180deg);
		}

		.card-actions-head {
			display: flex;
			gap: 4px;
			flex-shrink: 0;
		}

		/* ── Card Body ── */
		.card-body {
			display: none;
		}

		.card-body.open {
			display: block;
		}

		/* ── Password Section ── */
		.pw-section {
			padding: 1.25rem 1rem;
			text-align: center;
		}

		.pw-inner {
			max-width: 360px;
			margin: 0 auto;
		}

		.pw-icon {
			width: 48px;
			height: 48px;
			margin: 0 auto .75rem;
			border-radius: 50%;
			background: var(--color-warning-bg);
			display: flex;
			align-items: center;
			justify-content: center;
			color: var(--color-warning);
		}

		.pw-title {
			font-size: 15px;
			font-weight: 500;
			margin-bottom: .3rem;
		}

		.pw-sub {
			font-size: 13px;
			color: var(--color-text-secondary);
			margin-bottom: 1rem;
		}

		.pw-row {
			display: flex;
			gap: 8px;
			margin-bottom: 8px;
		}

		.pw-input-wrap {
			flex: 1;
			position: relative;
		}

		.pw-input {
			width: 100%;
			padding: 9px 36px 9px 12px;
			font-size: 13px;
			font-family: var(--font-mono);
			border: 0.5px solid var(--color-border-secondary);
			border-radius: var(--border-radius-md);
			background: var(--color-background-secondary);
			color: var(--color-text-primary);
			outline: none;
		}

		.pw-input:focus {
			border-color: var(--color-accent);
			box-shadow: 0 0 0 2px var(--color-accent-bg);
		}

		.pw-toggle {
			position: absolute;
			right: 4px;
			top: 50%;
			transform: translateY(-50%);
			background: none;
			border: none;
			cursor: pointer;
			color: var(--color-text-tertiary);
			padding: 4px;
			display: flex;
			align-items: center;
		}

		.pw-error {
			font-size: 12px;
			color: var(--color-error);
			margin-top: 4px;
			display: none;
		}

		.pw-error.show {
			display: block;
		}

		/* ── Info Banner ── */
		.info-banner {
			padding: 14px 16px;
			border-bottom: 0.5px solid var(--color-border-tertiary);
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
			gap: 12px;
		}

		.info-item {
		}

		.info-label {
			font-size: 10px;
			font-weight: 500;
			letter-spacing: .06em;
			text-transform: uppercase;
			color: var(--color-text-tertiary);
			margin-bottom: 3px;
		}

		.info-value {
			font-size: 13px;
			color: var(--color-text-primary);
			font-family: var(--font-mono);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* ── File Tree ── */
		.file-section {
			padding: 0;
		}

		.file-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 10px 16px;
			border-bottom: 0.5px solid var(--color-border-tertiary);
			gap: 8px;
			flex-wrap: wrap;
		}

		.file-toolbar-left {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.file-stats {
			font-size: 12px;
			color: var(--color-text-secondary);
			font-family: var(--font-mono);
		}

		.pkg-header {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 10px 16px;
			background: var(--color-background-secondary);
			border-bottom: 0.5px solid var(--color-border-tertiary);
			cursor: pointer;
			user-select: none;
			font-size: 13px;
			font-weight: 500;
		}

		.pkg-header:hover {
			background: var(--color-background-tertiary);
		}

		.pkg-count {
			font-size: 11px;
			font-family: var(--font-mono);
			color: var(--color-text-tertiary);
			font-weight: 400;
		}

		.file-item {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 7px 16px 7px 40px;
			font-size: 13px;
			border-bottom: 0.5px solid var(--color-border-tertiary);
			transition: background .1s;
		}

		.file-item:hover {
			background: var(--color-background-secondary);
		}

		.file-item:last-child {
			border-bottom: none;
		}

		.file-item.excluded {
			opacity: .45;
			text-decoration: line-through;
		}

		.file-check {
			width: 16px;
			height: 16px;
			border: 0.5px solid var(--color-border-secondary);
			border-radius: 4px;
			display: flex;
			align-items: center;
			justify-content: center;
			background: var(--color-background-secondary);
			cursor: pointer;
			flex-shrink: 0;
			transition: background .1s, border-color .1s;
		}

		.file-check.on {
			background: var(--color-accent);
			border-color: var(--color-accent);
		}

		.file-check.partial {
			background: var(--color-accent);
			border-color: var(--color-accent);
			opacity: .6;
		}

		.file-icon {
			color: var(--color-text-tertiary);
			flex-shrink: 0;
		}

		.file-name {
			flex: 1;
			min-width: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			color: var(--color-text-primary);
		}

		.file-size {
			font-size: 11px;
			font-family: var(--font-mono);
			color: var(--color-text-tertiary);
			white-space: nowrap;
			flex-shrink: 0;
		}

		/* ── Download Actions ── */
		.dl-actions {
			padding: 12px 16px;
			border-top: 0.5px solid var(--color-border-tertiary);
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			flex-wrap: wrap;
		}

		.dl-summary {
			font-size: 12px;
			color: var(--color-text-secondary);
			font-family: var(--font-mono);
		}

		/* ── Progress Section ── */
		.progress-section {
			padding: 12px 16px;
			border-top: 0.5px solid var(--color-border-tertiary);
		}

		.progress-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 10px;
		}

		.progress-title {
			font-size: 13px;
			font-weight: 500;
		}

		.progress-stats {
			font-size: 12px;
			font-family: var(--font-mono);
			color: var(--color-text-secondary);
			display: flex;
			gap: 12px;
		}

		.progress-bar-wrap {
			height: 6px;
			background: var(--color-background-tertiary);
			border-radius: 3px;
			overflow: hidden;
			margin-bottom: 10px;
		}

		.progress-bar {
			height: 100%;
			background: var(--color-accent);
			border-radius: 3px;
			transition: width .3s ease;
		}

		.progress-bar.complete {
			background: var(--color-success);
		}

		.progress-bar.error {
			background: var(--color-error);
		}

		.progress-files {
		}

		.pf-item {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6px 0;
			font-size: 12px;
			border-bottom: 0.5px solid var(--color-border-tertiary);
		}

		.pf-item:last-child {
			border-bottom: none;
		}

		.pf-status {
			flex-shrink: 0;
		}

		.pf-status.pending {

function getFileIcon(name) {
	const ext = name.split('.').pop().toLowerCase();
	const map = {
		'iso': 'disc', 'img': 'disc',
		'mkv': 'film', 'avi': 'film', 'mp4': 'film', 'mov': 'film',
		'rar': 'archive', 'zip': 'archive', '7z': 'archive', 'tar': 'archive', 'gz': 'archive',
		'nfo': 'file-text', 'txt': 'file-text', 'md': 'file-text',
		'jpg': 'image', 'jpeg': 'image', 'png': 'image', 'gif': 'image', 'bmp': 'image',
		'mp3': 'music', 'flac': 'music', 'wav': 'music', 'ogg': 'music',
		'srt': 'subtitles', 'sub': 'subtitles',
	};
	return map[ext] || 'file';

/* ── PasswordSection ── */
function PasswordSection({ onDecrypt }) {
	const [password, setPassword] = useState('');
	const [showPw, setShowPw] = useState(false);
	const [error, setError] = useState(false);
	const inputRef = useRef(null);

	const handleDecrypt = useCallback(() => {
		if (password.length === 0) {
			setError(true);
			return;
		}
		setError(false);
		onDecrypt(password);
	}, [password, onDecrypt]);

	const handleKeyDown = useCallback((e) => {
		if (e.key === 'Enter') handleDecrypt();
	}, [handleDecrypt]);

	return (
		<div className="pw-section">
			<div className="pw-inner">
				<div className="pw-icon"><Icon name="key-round" size={22} /></div>
				<div className="pw-title">Passwort erforderlich</div>
				<div className="pw-sub">Dieser Container ist verschl&uuml;sselt. Bitte Passwort eingeben.</div>
				<div className="pw-row">
					<div className="pw-input-wrap">
						<input
							className="pw-input"
							type={showPw ? 'text' : 'password'}
							placeholder="Passwort"
							ref={inputRef}
							value={password}
							onChange={(e) => setPassword(e.target.value)}
							onKeyDown={handleKeyDown}
						/>
						<button className="pw-toggle" onClick={() => setShowPw(!showPw)}>
							<Icon name={showPw ? 'eye-off' : 'eye'} size={14} />
						</button>
					</div>
					<button className="btn btn-accent" onClick={handleDecrypt}>
						<Icon name="unlock" size={14} /> Entschl&uuml;sseln
					</button>
				</div>
				<div className={`pw-error${error ? ' show' : ''}`}>Falsches Passwort. Bitte erneut versuchen.</div>
			</div>
		</div>
	);
}

/* ── ProgressSection ── */
function ProgressSection({ container, idx, onCancel }) {
	const c = container;
	const pct = c.progress || 0;
	const totalFiles = c.packages.reduce((s, p) => s + p.files.filter(f => f.selected).length, 0);
	const doneFiles = Math.floor(totalFiles * pct / 100);

	const speeds = ['2.4 MB/s', '3.1 MB/s', '1.8 MB/s', '2.9 MB/s'];
	const speed = speeds[idx % speeds.length];

	let fileIdx = 0;
	const fileRows = [];
	for (const pkg of c.packages) {
		for (const f of pkg.files) {
			if (!f.selected) continue;
			let status, statusIcon, fpct, label;
			if (fileIdx < doneFiles) {
				status = 'done';
				statusIcon = 'check-circle';
				fpct = 100;
				label = f.size;
			} else if (fileIdx === doneFiles && pct < 100) {
				status = 'running';
				statusIcon = 'loader';
				fpct = Math.round((pct % (100 / totalFiles)) * totalFiles);
				label = `${Math.round(parseFloat(f.size) * fpct / 100 * 10) / 10} / ${f.size}`;
			} else {
				status = 'pending';
				statusIcon = 'circle';
				fpct = 0;
				label = 'Wartend';
			}
			fileRows.push(
				<div className="pf-item" key={fileIdx}>
					<span className={`pf-status ${status}`}>
						<Icon name={statusIcon} size={14} className={status === 'running' ? 'spinner' : ''} />
					</span>
					<span className="pf-name">{f.name}</span>
					<span className="pf-progress">{label}</span>
					<div className="pf-bar-mini"><div className="pf-bar-mini-fill" style={{width:`${fpct}%`}}></div></div>
				</div>
			);
			fileIdx++;
		}
	}

	return (
		<div className="progress-section">
			<div className="progress-header">
				<span className="progress-title">Download l&auml;uft...</span>
				<div className="progress-stats">
					<span>{doneFiles}/{totalFiles} Dateien</span>
					<span>{speed}</span>
					<span>{Math.round(pct)}%</span>
				</div>
			</div>
			<div className="progress-bar-wrap">
				<div className="progress-bar" style={{width:`${pct}%`}}></div>
			</div>
			<div className="progress-files">{fileRows}</div>
			<div className="dl-actions" style={{borderTop:'none',padding:'12px 0 0'}}>
				<div></div>
				<button className="btn btn-ghost btn-danger" onClick={() => onCancel(idx)}>
					<Icon name="square" size={14} /> Abbrechen
				</button>
			</div>
		</div>
	);
}

/* ── SfdlCard ── */
function SfdlCard({
	container, idx, onToggle, onRemove, onDecrypt,
	onToggleFile, onTogglePkg, onTogglePkgSel, onSelectAll,
	onStartDownload, onCancelDownload, onReset, onCopySpeedReport,
	onDragStart, onDragEnd, onDragOver, onDragLeave, onDrop,
	isDragging, isDragTarget
}) {
	const c = container;
	const stateIcon = c.needsPassword && !c.decrypted ? 'encrypted' :
		c.decrypted ? 'open' : 'decrypted';

	let metaInfo = '';
	if (c.host) metaInfo = c.host;
	else if (c.needsPassword && !c.decrypted) metaInfo = 'Passwort erforderlich';
	else metaInfo = c.description || '';

	let body = null;
	if (c.needsPassword && !c.decrypted) {
		body = <PasswordSection onDecrypt={(pw) => onDecrypt(idx, pw)} />;
	} else if (c.downloadDone) {
		body = <ResultSection container={c} idx={idx} onReset={onReset} onCopySpeedReport={onCopySpeedReport} />;
	} else if (c.downloading) {
		body = <ProgressSection container={c} idx={idx} onCancel={onCancelDownload} />;
	} else if (c.packages.length > 0) {
		body = <FileSection container={c} idx={idx}
			onToggleFile={onToggleFile} onTogglePkg={onTogglePkg}
			onTogglePkgSel={onTogglePkgSel} onSelectAll={onSelectAll}
			onStartDownload={onStartDownload} />;
	}

	const cardClasses = ['sfdl-card'];
	if (isDragging) cardClasses.push('dragging');
	if (isDragTarget) cardClasses.push('drag-target');

	return (
		<div
			className={cardClasses.join(' ')}
			onDragOver={onDragOver}
			onDragLeave={onDragLeave}
			onDrop={onDrop}
		>
			<div className="card-header" onClick={() => onToggle(idx)}>
				<div
					className="drag-handle"
					draggable="true"
					onDragStart={(e) => onDragStart(e, idx)}
					onDragEnd={onDragEnd}
					onClick={(e) => e.stopPropagation()}
				>
					<Icon name="grip-vertical" size={16} />
				</div>
				<div className={`card-icon ${stateIcon}`}>
					<Icon name={c.needsPassword && !c.decrypted ? 'lock' : 'file-archive'} size={18} />
				</div>
				<div className="card-info">
					<div className="card-name">{c.name}</div>
					<div className="card-meta">
						{c.encrypted && <span className="card-badge badge-encrypted">Encrypted</span>}
						<span className={`card-badge badge-${c.version}`}>{c.version.toUpperCase()}</span>
						{c.downloading && <span className="card-badge badge-downloading">Downloading</span>}
						<span>{metaInfo}</span>
					</div>
				</div>
				<div className="card-actions-head">
					<button className="btn-icon btn-danger" onClick={(e) => { e.stopPropagation(); onRemove(idx); }} title="Entfernen">
						<Icon name="x" size={16} />
					</button>
				</div>
				<div className={`card-chevron${c.expanded ? ' open' : ''}`}>
					<Icon name="chevron-down" size={16} />
				</div>
			</div>
			<div className={`card-body${c.expanded ? ' open' : ''}`}>
				{body}
			</div>
		</div>
	);
}

/* ── ContainerList ── */
function ContainerList({
	containers, onOpenFile, onClearAll,
	onToggle, onRemove, onDecrypt,
	onToggleFile, onTogglePkg, onTogglePkgSel, onSelectAll,
	onStartDownload, onCancelDownload, onReset, onCopySpeedReport
}) {
	const [draggedIdx, setDraggedIdx] = useState(null);
	const [dragTargetIdx, setDragTargetIdx] = useState(null);
	const reorderRef = useRef(null);

	const handleDragStart = useCallback((e, idx) => {
		setDraggedIdx(idx);
		e.dataTransfer.effectAllowed = 'move';
		// Store to distinguish card reorder from file drops
		reorderRef.current = true;
	}, []);

	const handleDragEnd = useCallback(() => {
		setDraggedIdx(null);
		setDragTargetIdx(null);
		reorderRef.current = false;
	}, []);

	const handleDragOver = useCallback((e, idx) => {
		e.preventDefault();
		if (reorderRef.current) setDragTargetIdx(idx);
	}, []);

	const handleDragLeave = useCallback((e, idx) => {
		setDragTargetIdx((prev) => prev === idx ? null : prev);
	}, []);

	const handleDrop = useCallback((e, toIdx) => {
		e.preventDefault();
		setDragTargetIdx(null);
		if (draggedIdx !== null && draggedIdx !== toIdx && reorderRef.current) {
			// Reorder
			const newContainers = [...containers];
			const [moved] = newContainers.splice(draggedIdx, 1);
			newContainers.splice(toIdx, 0, moved);
			onRemove('__reorder__', newContainers);
		}
		setDraggedIdx(null);
		reorderRef.current = false;
	}, [draggedIdx, containers, onRemove]);

	return (
		<div>
			<div className="container-toolbar">
				<div className="container-toolbar-left">
					<span className="container-count">{containers.length} Container</span>
				</div>
				<div style={{display:'flex',gap:'6px'}}>
					<button className="btn btn-ghost btn-sm" onClick={onOpenFile}>
						<Icon name="plus" size={14} /> Hinzuf&uuml;gen
					</button>
					<button className="btn btn-ghost btn-sm btn-danger" onClick={onClearAll}>
						<Icon name="trash-2" size={14} /> Alle entfernen
					</button>
				</div>
			</div>
			<div>
				{containers.map((c, i) => (
					<SfdlCard
						key={c.id}
						container={c}
						idx={i}
						onToggle={onToggle}
						onRemove={onRemove}
						onDecrypt={onDecrypt}
						onToggleFile={onToggleFile}
						onTogglePkg={onTogglePkg}
						onTogglePkgSel={onTogglePkgSel}
						onSelectAll={onSelectAll}
						onStartDownload={onStartDownload}
						onCancelDownload={onCancelDownload}
						onReset={onReset}
						onCopySpeedReport={onCopySpeedReport}
						onDragStart={handleDragStart}
						onDragEnd={handleDragEnd}
						onDragOver={(e) => handleDragOver(e, i)}
						onDragLeave={(e) => handleDragLeave(e, i)}
						onDrop={(e) => handleDrop(e, i)}
						isDragging={draggedIdx === i}
						isDragTarget={dragTargetIdx === i}
					/>
				))}
			</div>
		</div>
	);
}

				</div>
			</div>

			{/* Passw&ouml;rter */}
			<div className="settings-card">
				<div className="sg-title">Auto-Passw&ouml;rter</div>
				<div className="tag-list">
					{pwTags.map((tag, i) => (
						<span className="tag" key={i}>
							{tag} <button className="tag-del" onClick={() => setPwTags(prev => prev.filter((_, j) => j !== i))}>&times;</button>
						</span>
					))}
				</div>
				<div className="sg-row" style={{marginTop:'8px'}}>
					<input className="sg-input sg-input-full" type="password" placeholder="Neues Passwort..." style={{flex:1}} />
					<button className="btn btn-ghost btn-sm"><Icon name="plus" size={14} /></button>
				</div>
			</div>

			{/* Speed Report */}
			<div className="settings-card">
				<div className="sg-title">Speed Report</div>
				<div className="sg-row">
					<div className="sg-label">Benutzername</div>
					<input className="sg-input" type="text" placeholder="Forum-Username" />
				</div>
			</div>

			<div className="settings-footer">
				<button className="btn btn-ghost" onClick={onClose}>Abbrechen</button>
				<button className="btn btn-accent" onClick={onClose}>Speichern</button>
			</div>
		</div>
	);
}

/* ── App ── */
function App() {
	const [containers, setContainers] = useState(() => deepClone(DEMO_CONTAINERS));
	const [view, setView] = useState('main'); // 'main' or 'settings'
	const [theme, setThemeState] = useState(() => localStorage.getItem('rsfdl-theme') || 'system');
	const [dragOverlay, setDragOverlay] = useState(false);
	const dragCounterRef = useRef(0);
	const fileInputRef = useRef(null);
	const nextIdRef = useRef(4);
	const intervalsRef = useRef({});

	// Apply theme
	const setTheme = useCallback((mode) => {
		localStorage.setItem('rsfdl-theme', mode);
		setThemeState(mode);
	}, []);

	useEffect(() => {
		const root = document.documentElement;
		root.removeAttribute('data-theme');
		if (theme === 'light') root.setAttribute('data-theme', 'light');
		else if (theme === 'dark') root.setAttribute('data-theme', 'dark');
	}, [theme]);

	// Full-window drag & drop
	useEffect(() => {
		const handleDragEnter = (e) => {
			e.preventDefault();
			dragCounterRef.current++;
			setDragOverlay(true);
		};
		const handleDragLeave = (e) => {
			e.preventDefault();
			dragCounterRef.current--;
			if (dragCounterRef.current <= 0) {
				dragCounterRef.current = 0;
				setDragOverlay(false);
			}
		};
		const handleDragOver = (e) => e.preventDefault();
		const handleDrop = (e) => {
			e.preventDefault();
			dragCounterRef.current = 0;
			setDragOverlay(false);
			if (e.dataTransfer.files.length > 0) {
				setContainers(prev => {
					let next = [...prev];
					for (const f of e.dataTransfer.files) {
						if (f.name.endsWith('.sfdl')) {
							next = [...next, createContainer(f.name)];
						}
					}
					return next;
				});
			}
		};

		document.addEventListener('dragenter', handleDragEnter);
		document.addEventListener('dragleave', handleDragLeave);
		document.addEventListener('dragover', handleDragOver);
		document.addEventListener('drop', handleDrop);

		return () => {
			document.removeEventListener('dragenter', handleDragEnter);
			document.removeEventListener('dragleave', handleDragLeave);
			document.removeEventListener('dragover', handleDragOver);
			document.removeEventListener('drop', handleDrop);
		};
	}, []);

	// Cleanup intervals on unmount
	useEffect(() => {
		return () => {
			Object.values(intervalsRef.current).forEach(clearInterval);
		};
	}, []);

	const createContainer = useCallback((filename) => {
		const id = nextIdRef.current++;
		const encrypted = Math.random() > 0.5;
		const needsPassword = Math.random() > 0.5;
		const c = {
			id,
			name: filename.replace(/\.sfdl$/i, ''),
			encrypted,
			version: Math.random() > 0.3 ? 'v3' : 'v2',
			needsPassword,
			decrypted: false,
			description: 'Container ' + id,
			host: null,
			packages: [],
			expanded: true,
			downloading: false,
			downloadDone: false,
			progress: 0,
		};
		if (!needsPassword) {
			c.decrypted = true;
			c.host = 'ftp' + id + '.example.com';
			c.packages = [{
				name: 'Package 1',
				expanded: true,
				files: [
					{name: 'file_01.rar', size: '2.1 GB', selected: true},
					{name: 'file_02.rar', size: '2.1 GB', selected: true},
					{name: 'info.nfo', size: '0.5 KB', selected: false, excluded: true},
				]
			}];
		}
		return c;
	}, []);

	const openFileDialog = useCallback(() => {
		if (fileInputRef.current) fileInputRef.current.click();
	}, []);

	const handleFilesChosen = useCallback((e) => {
		const files = e.target.files;
		if (files.length > 0) {
			setContainers(prev => {
				let next = [...prev];
				for (const f of files) {
					next = [...next, createContainer(f.name)];
				}
				return next;
			});
			e.target.value = '';
		}
	}, [createContainer]);

	const toggleCard = useCallback((idx) => {
		setContainers(prev => {
			const next = deepClone(prev);
			next[idx].expanded = !next[idx].expanded;
			return next;
		});
	}, []);

	const removeCard = useCallback((idx, reorderedList) => {
		if (idx === '__reorder__') {
			setContainers(reorderedList);
			return;
		}
		setContainers(prev => {
			const next = [...prev];
			const removed = next.splice(idx, 1)[0];
			if (intervalsRef.current[removed.id]) {
				clearInterval(intervalsRef.current[removed.id]);
				delete intervalsRef.current[removed.id];
			}
			return next;
		});
	}, []);

	const clearAll = useCallback(() => {
		Object.values(intervalsRef.current).forEach(clearInterval);
		intervalsRef.current = {};
		setContainers([]);
	}, []);

	const decryptCard = useCallback((idx, pw) => {
		setContainers(prev => {
			const next = deepClone(prev);
			const c = next[idx];
			c.decrypted = true;
			c.needsPassword = false;
			c.host = 'ftp.example.com';
			c.packages = [{
				name: c.name,
				expanded: true,
				files: [
					{name: 'Movie.Part1.rar', size: '4.0 GB', selected: true},
					{name: 'Movie.Part2.rar', size: '4.0 GB', selected: true},
					{name: 'Movie.Part3.rar', size: '3.2 GB', selected: true},
					{name: 'cover.jpg', size: '180 KB', selected: false, excluded: true},
					{name: 'info.nfo', size: '0.8 KB', selected: false, excluded: true},
				]
			}];
			return next;
		});
	}, []);

	const toggleFile = useCallback((idx, pi, fi) => {
		setContainers(prev => {
			const next = deepClone(prev);
			const f = next[idx].packages[pi].files[fi];
			f.selected = !f.selected;
			if (f.selected) f.excluded = false;
			return next;
		});
	}, []);

	const togglePkg = useCallback((idx, pi) => {
		setContainers(prev => {
			const next = deepClone(prev);
			next[idx].packages[pi].expanded = !next[idx].packages[pi].expanded;
			return next;
		});
	}, []);

	const togglePkgSel = useCallback((idx, pi) => {
		setContainers(prev => {
			const next = deepClone(prev);
			const pkg = next[idx].packages[pi];
			const allSel = pkg.files.every(f => f.selected);
			pkg.files.forEach(f => {
				f.selected = !allSel;
				if (!allSel) f.excluded = false;
			});
			return next;
		});
	}, []);

	const selectAll = useCallback((idx, val) => {
		setContainers(prev => {
			const next = deepClone(prev);
			next[idx].packages.forEach(p => p.files.forEach(f => {
				f.selected = val;
				if (val) f.excluded = false;
			}));
			return next;
		});
	}, []);

	const startDownload = useCallback((idx) => {
		setContainers(prev => {
			const next = deepClone(prev);
			next[idx].downloading = true;
			next[idx].progress = 0;
			const containerId = next[idx].id;

			const iv = setInterval(() => {
				setContainers(current => {
					const ci = current.findIndex(c => c.id === containerId);
					if (ci === -1) {
						clearInterval(iv);
						delete intervalsRef.current[containerId];
						return current;
					}
					const updated = deepClone(current);
					updated[ci].progress = Math.min(100, updated[ci].progress + Math.random() * 4 + 1);
					if (updated[ci].progress >= 100) {
						clearInterval(iv);
						delete intervalsRef.current[containerId];
						updated[ci].downloading = false;
						updated[ci].downloadDone = true;
					}
					return updated;
				});
			}, 400);
			intervalsRef.current[containerId] = iv;

			return next;
		});
	}, []);

	const cancelDownload = useCallback((idx) => {
		setContainers(prev => {
			const next = deepClone(prev);
			const c = next[idx];
			if (intervalsRef.current[c.id]) {
				clearInterval(intervalsRef.current[c.id]);
				delete intervalsRef.current[c.id];
			}
			c.downloading = false;
			c.progress = 0;
			return next;
		});
	}, []);

	const resetCard = useCallback((idx) => {
		setContainers(prev => {
			const next = deepClone(prev);
			next[idx].downloadDone = false;
			next[idx].progress = 0;
			return next;
		});
	}, []);

	const copySpeedReport = useCallback((idx) => {
		alert('Speed Report in Zwischenablage kopiert!');
	}, []);

	const openSettings = useCallback(() => {
		setView('settings');
		window.scrollTo(0, 0);
	}, []);

	const closeSettings = useCallback(() => {
		setView('main');
	}, []);

	return (
		<React.Fragment>
			<DragOverlay active={dragOverlay} />

			<Header
				theme={theme}
				setTheme={setTheme}
				onOpenFile={openFileDialog}
				onOpenSettings={openSettings}
			/>

			<input
				type="file"
				ref={fileInputRef}
				accept=".sfdl"
				multiple
				style={{display:'none'}}
				onChange={handleFilesChosen}
			/>

			{view === 'settings' ? (
				<SettingsView onClose={closeSettings} />
			) : (
				<main className="main-wrap">
					{containers.length === 0 ? (
						<DropZone onOpenFile={openFileDialog} />
					) : (
						<ContainerList
							containers={containers}
							onOpenFile={openFileDialog}
							onClearAll={clearAll}
							onToggle={toggleCard}
							onRemove={removeCard}
							onDecrypt={decryptCard}
							onToggleFile={toggleFile}
							onTogglePkg={togglePkg}
							onTogglePkgSel={togglePkgSel}
							onSelectAll={selectAll}
							onStartDownload={startDownload}
							onCancelDownload={cancelDownload}
							onReset={resetCard}
							onCopySpeedReport={copySpeedReport}
						/>
					)}
				</main>
			)}
		</React.Fragment>
	);
}

/* ── Mount ── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
